---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton
  namespace: {{ .Release.Namespace }}
  labels:
    app: triton
  annotations:
    {{- toYaml $.Values.annotations | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: triton
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8002"
        {{- toYaml $.Values.annotations | nindent 8 }}
      labels:
        teknoir.org/app: triton
        app: triton
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        {{- toYaml $.Values.nodeSelector | nindent 8 }}
{{- if not (empty .Values.models) }}
      initContainers:
{{- range .Values.models }}
        - name: init-container-{{ .name | lower | replace "_" "-" | trunc 48 | trimSuffix "-" }}
          image: {{ .image }}
          imagePullPolicy: {{ include "triton.modelPullPolicy" (dict "root" $ "model" .) }}
          volumeMounts:
            - name: model-volume
              mountPath: /models
{{- end }}
{{- end }}
      containers:
        - name: triton
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [ "/opt/tritonserver/bin/tritonserver" ]
          args:
            - "--model-repository=/models"
            - "--backend-directory=/opt/tritonserver/backends"
            - "--log-verbose={{ .Values.tritonArgs.logVerbose }}"
            - "--log-info=true"
            - "--log-warning=true"
            - "--log-error=true"
            - "--min-supported-compute-capability={{ .Values.tritonArgs.minSupportedComputeCapability }}"
            - "--exit-on-error={{ .Values.tritonArgs.exitOnError }}"
            - "--strict-readiness={{ .Values.tritonArgs.strictReadiness }}"
{{- if .Values.loadModels }}
            - "--model-control-mode=explicit"
{{- range .Values.loadModels }}
            - "--load-model={{ . }}"
{{- end }}
{{- end }}
{{- range .Values.tritonArgs.extraArgs }}
            - {{ . | quote }}
{{- end }}
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 8001
              name: grpc
            - containerPort: 8002
              name: metrics
          livenessProbe:
            httpGet:
              path: /v2/health/live
              port: http
{{- if .Values.probes.startup.enabled }}
          startupProbe:
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            httpGet:
              path: /v2/health/live
              port: http
{{- end }}
          readinessProbe:
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
{{- if eq (len .Values.requiredModels) 1 }}
            httpGet:
              path: /v2/models/{{ index .Values.requiredModels 0 }}/ready
              port: http
{{- else if gt (len .Values.requiredModels) 1 }}
            exec:
              command:
                - sh
                - -c
                - 'for m in "$@"; do curl -fsS --max-time 2 -o /dev/null "http://127.0.0.1:8000/v2/models/${m}/ready" || exit 1; done'
                - ready-check
{{- range .Values.requiredModels }}
                - {{ . | quote }}
{{- end }}
{{- else }}
            httpGet:
              path: /v2/health/ready
              port: http
{{- end }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          volumeMounts:
            - name: model-volume
              mountPath: /models
      volumes:
        - name: model-volume
          hostPath:
            # directory location on host
            path: "{{ .Values.modelRepositoryPath }}"
            type: DirectoryOrCreate